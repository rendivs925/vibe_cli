[package]
name = "application"
version = "0.1.0"
edition = "2021"

[dependencies]
base64 = "0.22"
bincode = "1.3"
domain = { path = "../domain" }
shared = { path = "../shared" }
infrastructure = { path = "../infrastructure" }
anyhow.workspace = true

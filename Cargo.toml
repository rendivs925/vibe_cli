[workspace]
resolver = "2"
members = [
    "domain",
    "application",
    "infrastructure",
    "presentation",
    "shared",
    "tests",
    "cli"
]

[workspace.package]
version = "2.0.0"
edition = "2021"
license = "MIT"
authors = ["Vibe CLI Team"]
description = "A comprehensive AI-powered CLI assistant for system administration, development automation, and intelligent command execution"
repository = "https://github.com/vibe-cli/vibe_cli"
homepage = "https://vibe-cli.dev"
keywords = ["cli", "ai", "automation", "system-administration", "devops"]
categories = ["command-line-utilities", "development-tools"]

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[workspace.dependencies]
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.39", features = ["full"] }
clap = { version = "4.5", features = ["derive"] }
reqwest = { version = "0.12", features = ["json"] }
colored = "2.1"
dialoguer = "0.11"
arboard = "3.4"
rusqlite = { version = "0.32", features = ["bundled"] }
memmap2 = "0.9"
rayon = "1.10"
smallvec = "1.13"
arrayvec = "0.7"
dotenvy = "0.15"
docx-rs = "0.4"
crossterm = "0.27"
uuid = { version = "1.8", features = ["v4"] }
num_cpus = "1.16"
criterion = { version = "0.5", features = ["html_reports"] }
candle-core = { version = "0.7", default-features = false }
candle-nn = { version = "0.7", default-features = false }
candle-transformers = { version = "0.7", default-features = false }
hf-hub = "0.3"
tokenizers = "0.19"
half = { version = "2.4", features = ["std", "serde"] }
